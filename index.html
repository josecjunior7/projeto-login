<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaquery.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="img">

            </div>
            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações do ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="field">
                        <i class="fas fa-user"></i>
                        <input type="email" name="email" id="imail" placeholder="seu@email.com" autocomplete="email" required maxlength="45">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="field">
                        <i class="fas fa-key"></i>
                        <input type="password" name="pass" id="ipass" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="15">
                        <label for="ipass">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                        <a class="buttom" href="#">Esqueci a senha<i class="fas fa-envelope"></i></a>
                        
                </form>
            </div>
        </section>
    </main>
</body>
</html>
